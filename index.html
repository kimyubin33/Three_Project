<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plasmid Transformation - Ch.1 Thawing</title>
    <style>
        :root {
            --bg-color: #0b0b0f;
            --panel-bg: rgba(20, 20, 30, 0.7);
            --accent-color: #3b82f6;
            --accent-hover: #1d4ed8;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .ui-overlay {
            position: absolute;
            z-index: 10;
            pointer-events: none;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
        }

        .interactive {
            pointer-events: auto;
        }

        /* 상단 타이틀 바 */
        header {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            padding: 16px 24px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            width: calc(100% - 48px);
            margin: 0 auto;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .logo-group h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, #3b82f6, #8b5cf6);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-group p {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .step-badge {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #60a5fa;
            padding: 6px 12px;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        /*챕터 네비게이션 */
        .chapter-nav {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chapter-nav-btn {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.25);
            color: #93c5fd;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            user-select: none;
        }

        .chapter-nav-btn:hover:not(:disabled){
            background: rgba(59,130,246,0.3);
            border-color: rgba(59,130,246,0.5);
            color: #dbeafe;
        }

        .chapter-nav-btn:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }

        .chapter-nav-label {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #60a5fa;
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
            min-width: 200px;
            text-align: center;
            cursor: default;
            user-select: none;
        }

        .chapter-nav-label.unimplemented {
            color: #9ca3af;
            background: rgba(120, 120, 130, 0.15);
            border-color: rgba(120, 120, 130, 0.25);
        }

        /* 좌측 사이드바 */
        .sidebar {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            padding: 22px;
            border-radius: 20px;
            width: 360px;
            max-height: calc(100vh - 180px);
            overflow-y: auto;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            margin-top: 20px;
            transition: all 0.3s ease;
        }

        /* 사이드바 스크롤바 (살짝만 보이게) */
        .sidebar::-webkit-scrollbar {
            width: 6px;
        }
        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .sidebar h2 {
            font-size: 1.05rem;
            margin-bottom: 6px;
            color: #f3f4f6;
            border-left: 4px solid var(--accent-color);
            padding-left: 8px;
        }

        .sidebar .chapter-sub {
            font-size: 0.78rem;
            color: #60a5fa;
            margin-bottom: 10px;
            margin-top: 2px;
            font-weight: 600;
        }

        .sidebar p {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.55;
            margin-bottom: 16px;
        }

        .section-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin: 14px 0 8px 0;
            padding-left: 2px;
        }

        .object-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .object-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 9px 12px;
            border-radius: 8px;
            font-size: 0.78rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .object-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .object-item .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            flex-shrink: 0;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.15);
        }

        .object-item .item-name {
            color: #e5e7eb;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .object-item .item-status {
            font-weight: 500;
            white-space: nowrap;
            flex-shrink: 0;
            font-size: 0.74rem;
        }

        /* 하단 도움말 바 */
        footer {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border-top: 1px solid var(--border-color);
            width: 100%;
            position: absolute;
            bottom: 0;
            left: 0;
            padding: 12px 24px;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            z-index: 10;
        }

        /* 로딩 화면 */
        #loader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-color);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: var(--accent-color);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loader-text {
            margin-top: 16px;
            font-size: 0.9rem;
            color: var(--text-muted);
            letter-spacing: 0.05em;
        }
        /*피펫 디스플레이 라벨 (CSS2DRenderer로 3D 좌표에 부착) */
        .pipette-display-label {
            background: #0a0e1a;
            color: #ff4444;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            border: 1px solid #1a2030;
            border-radius: 2px;
            padding: 2px 5px;
            text-align: center;
            box-shadow: inset 0 0 4px rgba(255, 68, 68, 0.3);
            user-select: none;
            pointer-events: none;
            min-width: 38px;
        }

        .pipette-display-label .pd-main {
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            line-height: 1;
            text-shadow: 0 0 3px rgba(255, 68, 68, 0.6);
        }

        .pipette-display-label .pd-unit {
            font-size: 0.5rem;
            color: #ff8888;
            margin-top: 1px;
            letter-spacing: 0;
            opacity: 0.7;
        }
        .pipette-display-label.target-matched{
            color: #22c55e;
            border-color: #166534;
            box-shadow: inset 0 0 6px rgba(34, 197, 94, 0.7);
        }

        .pipette-display-label.target-matched .pd-unit{
            color: #4ade80;
        }

        /* 다이얼 입력 패널 (피펫 클릭 시 표시) */
.dial-panel-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease;
}

.dial-panel-overlay.open {
    opacity: 1;
    pointer-events: auto;
}

.dial-panel {
    background: rgba(20, 24, 38, 0.96);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 18px;
    padding: 24px 28px;
    min-width: 340px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    transform: scale(0.95);
    transition: transform 0.18s ease;
}

.dial-panel-overlay.open .dial-panel {
    transform: scale(1);
}

.dp-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
}

.dp-title {
    font-size: 0.78rem;
    color: #9ca3af;
    letter-spacing: 0.1em;
}

.dp-close {
    background: transparent;
    border: none;
    color: #9ca3af;
    font-size: 1.4rem;
    cursor: pointer;
    line-height: 1;
    padding: 0 4px;
    transition: color 0.15s;
}

.dp-close:hover {
    color: #f3f4f6;
}

.dp-subtitle {
    font-size: 1rem;
    font-weight: 600;
    color: #f3f4f6;
    margin-bottom: 20px;
}

.dp-input-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    background: #0a0e1a;
    border: 1px solid #1a2030;
    border-radius: 10px;
    padding: 16px 20px;
    margin-bottom: 14px;
    box-shadow: inset 0 0 12px rgba(255, 68, 68, 0.15);
}

.dp-input {
    background: transparent;
    border: none;
    outline: none;
    color: #ff4444;
    font-family: 'Courier New', monospace;
    font-weight: bold;
    font-size: 2.4rem;
    width: 100%;
    text-align: center;
    letter-spacing: 0.08em;
    text-shadow: 0 0 8px rgba(255, 68, 68, 0.7);
    caret-color: #ff4444;
}

.dp-unit {
    color: #ff8888;
    font-family: 'Courier New', monospace;
    font-size: 1.1rem;
    opacity: 0.7;
}

.dp-display-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    background: rgba(255, 255, 255, 0.03);
    border-radius: 8px;
    margin-bottom: 12px;
}

.dp-display-label {
    font-size: 0.8rem;
    color: #9ca3af;
}

.dp-display-value {
    font-family: 'Courier New', monospace;
    font-weight: bold;
    color: #ff4444;
    font-size: 1.1rem;
    letter-spacing: 0.1em;
}

.dp-range {
    font-size: 0.75rem;
    color: #6b7280;
    text-align: center;
    margin-bottom: 4px;
}

.dp-warning {
    font-size: 0.78rem;
    color: #fbbf24;
    text-align: center;
    min-height: 1.2em;
    opacity: 0;
    transition: opacity 0.15s;
    margin-bottom: 8px;
}

.dp-warning.show {
    opacity: 1;
}

.dp-hint {
    font-size: 0.72rem;
    color: #6b7280;
    text-align: center;
    margin-top: 8px;
}

.dp-target {
    font-size: 0.82rem;
    color: #9ca3af;
    text-align: center;
    margin-bottom: 6px;
    min-height: 1.2em;
    opacity: 0;
    transition: opacity 0.15s, color 0.15s;
}

.dp-target.show {
    opacity: 1;
}

.dp-target.matched {
    color: #22c55e;
    font-weight: 600;
}

/* 스텝 컨트롤 (하단 중앙) */
.step-control {
    position: absolute;
    bottom: 56px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--panel-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border-color);
    border-radius: 14px;
    padding: 12px 18px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
}

.step-control.visible {
    opacity: 1;
    pointer-events: auto;
}

.sc-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 180px;
}

.sc-progress {
    font-size: 0.72rem;
    color: #60a5fa;
    font-weight: 600;
    letter-spacing: 0.05em;
}

.sc-label {
    font-size: 0.85rem;
    color: #f3f4f6;
}

.sc-next-btn {
    background: linear-gradient(to right, #3b82f6, #6366f1);
    border: none;
    color: white;
    padding: 10px 22px;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
    font-family: inherit;
}

.sc-next-btn:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(59, 130, 246, 0.4);
}

.sc-next-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.sc-next-btn.playing {
    opacity: 0.6;
    cursor: wait;
}

    </style>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "gsap": "https://unpkg.com/gsap@3.12.5/index.js"
  }
}
</script>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <div class="loader-text">Loading 3D Laboratory Scene...</div>
    </div>

    <div id="webgl-container"></div>

    <div class="ui-overlay">
        <header class="interactive">
            <div class="logo-group">
                <h1>Plasmid Transformation Simulator</h1>
                <p>3D Interactive Laboratory Workspace</p>
            </div>
            <div id="chapter-nav-mount"></div>
        </header>

        <!-- 사이드바: 내용은 Sidebar.js가 동적으로 채움 -->
        <div class="sidebar interactive" id="sidebar-mount">
            <!-- placeholder during initial paint -->
        </div>
    </div>

    <!-- 스텝 컨트롤 (하단 중앙) -->
    <!--
    StepControl UI 장착 영역(mount point)

    JavaScript에서 이 div를 가져와:
    - Next 버튼
    - 현재 Step 이름
    - 진행률 표시
    - Play/Pause 버튼
    등의 UI를 동적으로 삽입한다.

    현재는 빈 컨테이너 역할만 한다.
     -->
    <div class="step-control interactive" id="step-control-mount"></div>

    <footer>
        마우스 드래그: 회전 · 우클릭 드래그: 이동 · 휠: 확대/축소 · 객체에 마우스 올리면 정보 표시
    </footer>

    <script type="module" src="./main.js"></script>
</body>
</html>
