<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plasmid Transformation - Ch.1 Thawing</title>
    <style>
        :root {
            --bg-color: #0b0b0f;
            --panel-bg: rgba(20, 20, 30, 0.7);
            --accent-color: #3b82f6;
            --accent-hover: #1d4ed8;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .ui-overlay {
            position: absolute;
            z-index: 10;
            pointer-events: none;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
        }

        .interactive {
            pointer-events: auto;
        }

        /* 상단 타이틀 바 */
        header {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            padding: 16px 24px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            width: calc(100% - 48px);
            margin: 0 auto;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .logo-group h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, #3b82f6, #8b5cf6);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-group p {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .step-badge {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #60a5fa;
            padding: 6px 12px;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* 좌측 사이드바 */
        .sidebar {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            padding: 22px;
            border-radius: 20px;
            width: 360px;
            max-height: calc(100vh - 180px);
            overflow-y: auto;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            margin-top: 20px;
            transition: all 0.3s ease;
        }

        /* 사이드바 스크롤바 (살짝만 보이게) */
        .sidebar::-webkit-scrollbar {
            width: 6px;
        }
        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .sidebar h2 {
            font-size: 1.05rem;
            margin-bottom: 6px;
            color: #f3f4f6;
            border-left: 4px solid var(--accent-color);
            padding-left: 8px;
        }

        .sidebar .chapter-sub {
            font-size: 0.78rem;
            color: #60a5fa;
            margin-bottom: 10px;
            margin-top: 2px;
            font-weight: 600;
        }

        .sidebar p {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.55;
            margin-bottom: 16px;
        }

        .section-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin: 14px 0 8px 0;
            padding-left: 2px;
        }

        .object-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .object-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 9px 12px;
            border-radius: 8px;
            font-size: 0.78rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .object-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .object-item .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            flex-shrink: 0;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.15);
        }

        .object-item .item-name {
            color: #e5e7eb;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .object-item .item-status {
            font-weight: 500;
            white-space: nowrap;
            flex-shrink: 0;
            font-size: 0.74rem;
        }

        /* 하단 도움말 바 */
        footer {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border-top: 1px solid var(--border-color);
            width: 100%;
            position: absolute;
            bottom: 0;
            left: 0;
            padding: 12px 24px;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            z-index: 10;
        }

        /* 로딩 화면 */
        #loader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-color);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: var(--accent-color);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loader-text {
            margin-top: 16px;
            font-size: 0.9rem;
            color: var(--text-muted);
            letter-spacing: 0.05em;
        }
    </style>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <div class="loader-text">Loading 3D Laboratory Scene...</div>
    </div>

    <div id="webgl-container"></div>

    <div class="ui-overlay">
        <header class="interactive">
            <div class="logo-group">
                <h1>Plasmid Transformation Simulator</h1>
                <p>3D Interactive Laboratory Workspace</p>
            </div>
            <div class="step-badge" id="chapter-badge">Ch.1 Thawing (해동 단계)</div>
        </header>

        <!-- 사이드바: 내용은 Sidebar.js가 동적으로 채움 -->
        <div class="sidebar interactive" id="sidebar-mount">
            <!-- placeholder during initial paint -->
        </div>
    </div>

    <footer>
        마우스 드래그: 회전 · 우클릭 드래그: 이동 · 휠: 확대/축소 · 객체에 마우스 올리면 정보 표시
    </footer>

    <script type="module" src="./main.js"></script>
</body>
</html>
